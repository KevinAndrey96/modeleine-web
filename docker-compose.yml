services:
  app:
    image: php:8.1-apache
    container_name: modeleine-marketplace
    restart: unless-stopped
    ports:
      - "8088:80"
    environment:
      DB_HOST: db
      DB_NAME: modeleine_app
      DB_USER: modeleine_user
      DB_PASSWORD: modeleine_password
    volumes:
      - .:/var/www/html
    entrypoint: >
      sh -c "docker-php-ext-install mysqli pdo pdo_mysql &&
             docker-php-entrypoint apache2-foreground"
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: modeleine-mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: modeleine_app
      MYSQL_USER: modeleine_user
      MYSQL_PASSWORD: modeleine_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
