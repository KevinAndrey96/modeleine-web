services:
  app:
    image: php:8.1-apache
    container_name: casting-marketplace-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-casting_db}
      DB_USER: ${DB_USER:-casting_user}
      DB_PASSWORD: ${DB_PASSWORD:-casting_password}
    volumes:
      - .:/var/www/html
    entrypoint: >
      sh -c "docker-php-ext-install mysqli pdo pdo_mysql &&
             docker-php-entrypoint apache2-foreground"
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: casting-marketplace-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-casting_db}
      MYSQL_USER: ${DB_USER:-casting_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-casting_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "${DB_PORT:-3309}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: casting-marketplace-pma
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8089}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db

volumes:
  db_data:
